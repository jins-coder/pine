<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PineJS Inspector</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --subtext: #9ca3af;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s ease;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .pane {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      max-height: 80vh;
    }
    .node-item {
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
    }
    .node-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .node-item.selected {
      background: var(--accent-glow);
      color: var(--accent);
    }
    pre {
      margin: 0;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      color: #a7f3d0;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌲 PineJS DevTools <span>v1.7.0</span></h1>
    <div>
      <button id="refresh-btn">🔄 Refresh Tree</button>
    </div>
  </header>
  <div class="grid">
    <div class="pane" id="tree-pane">
      <h3>Active Components</h3>
      <div id="tree-list"></div>
    </div>
    <div class="pane" id="state-pane">
      <h3>Reactive Scope State</h3>
      <pre id="state-json">// Select a component to inspect its reactive signals & data</pre>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
