<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PineJS Interactive Playground & Sandbox</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="docs.css">
  <style>
    .playground-container {
      display: flex;
      height: calc(100vh - var(--header-height));
      margin-top: var(--header-height);
    }
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      background: var(--bg-surface);
    }
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
    }
    .pane-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1.2rem;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .code-editor {
      flex: 1;
      width: 100%;
      background: var(--bg-code);
      color: #e2e8f0;
      border: none;
      padding: 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      white-space: pre;
    }
    .preview-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
    .preset-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="index.html" class="brand-wrapper">
        <div class="brand-logo">
          <img src="logo.svg" alt="PineJS Logo" width="24" height="24" style="display: block;">
        </div>
        <div class="brand-title">PineJS Playground</div>
      </a>
      <select id="preset-picker" class="preset-select">
        <option value="counter">Preset: Interactive Counter</option>
        <option value="forloop">Preset: p-for Loops & Filtering</option>
        <option value="todo">Preset: Fine-Grained Todo App</option>
        <option value="cart">Preset: Reactive Shopping Cart</option>
        <option value="tabs">Preset: Dynamic Tabs & Modals</option>
        <option value="persist">Preset: $persist LocalStorage Sync</option>
      </select>
    </div>

    <div class="header-actions">
      <button id="run-btn" class="btn-demo" style="padding: 0.4rem 1rem;">▶ Run Code (Ctrl+Enter)</button>
      <a href="index.html" class="nav-link">Back to Documentation</a>
    </div>
  </header>

  <div class="playground-container">
    <!-- Code Editor Pane -->
    <div class="editor-pane">
      <div class="pane-toolbar">
        <span>HTML & PineJS Directives</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Auto-executes on changes</span>
      </div>
      <textarea id="code-input" class="code-editor" spellcheck="false"></textarea>
    </div>

    <!-- Live Preview Pane -->
    <div class="preview-pane">
      <div class="pane-toolbar">
        <span>Live Preview Output</span>
        <button id="refresh-btn" class="btn-demo-outline" style="padding: 0.2rem 0.6rem; font-size: 0.75rem;">Reload Preview</button>
      </div>
      <iframe id="preview-frame" class="preview-frame"></iframe>
    </div>
  </div>

  <script>
    const presets = {
      counter: `<div p-data="{ count: 0, step: 1 }" style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 450px; margin: 0 auto;">
  <h2 style="margin-top: 0; color: #10b981;">🌲 Fine-Grained Counter</h2>
  <p>Count is updated via atomic Signals without Virtual DOM diffing.</p>
  
  <div style="display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.5rem;">
    <button @click="count -= step" style="padding: 0.5rem 1rem; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.2rem;">-</button>
    <span p-text="count" style="font-size: 2.2rem; font-weight: 800; min-width: 60px; text-align: center; color: #0f172a;"></span>
    <button @click="count += step" style="padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.2rem;">+</button>
  </div>

  <div style="color: #64748b; font-size: 0.9rem;">
    Step Size: <input type="number" p-model.number="step" style="width: 50px; padding: 0.3rem; border: 1px solid #cbd5e1; border-radius: 4px;" />
  </div>
</div>`,

      forloop: `<div p-data="{
  search: '',
  sortBy: 'name',
  techStack: [
    { id: 1, name: 'PineJS', category: 'Micro-Framework', rating: 5 },
    { id: 2, name: 'Vite', category: 'Build Tool', rating: 5 },
    { id: 3, name: 'TypeScript', category: 'Language', rating: 5 },
    { id: 4, name: 'ESBuild', category: 'Bundler', rating: 4 },
    { id: 5, name: 'Terser', category: 'Minifier', rating: 4 }
  ],
  newItem: '',
  newCat: 'Tool',
  get filteredList() {
    return this.techStack
      .filter(item => item.name.toLowerCase().includes(this.search.toLowerCase()) || item.category.toLowerCase().includes(this.search.toLowerCase()))
      .sort((a, b) => this.sortBy === 'rating' ? (b.rating - a.rating) : a.name.localeCompare(b.name));
  },
  add() {
    if (this.newItem.trim()) {
      this.techStack.push({
        id: Date.now(),
        name: this.newItem.trim(),
        category: this.newCat,
        rating: 5
      });
      this.newItem = '';
    }
  },
  remove(id) {
    this.techStack = this.techStack.filter(it => it.id !== id);
  }
}" style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 520px; margin: 0 auto; color: #0f172a;">
  <h2 style="color: #10b981; margin-top: 0; display: flex; align-items: center; justify-content: space-between;">
    <span>⚡ p-for Keyed Loop</span>
    <span style="font-size: 0.85rem; color: #64748b;" p-text="filteredList.length + ' items'"></span>
  </h2>
  <p style="color: #64748b; font-size: 0.95rem;">Fine-grained declarative list rendering with real-time search filtering & sorting.</p>

  <!-- Controls & Search -->
  <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
    <input p-model="search" placeholder="Filter items..." style="flex: 1; min-width: 160px; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px;" />
    <select p-model="sortBy" style="padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; background: white;">
      <option value="name">Sort by Name</option>
      <option value="rating">Sort by Rating</option>
    </select>
  </div>

  <!-- Add New Item -->
  <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
    <input p-model="newItem" @keydown.enter="add()" placeholder="Add new technology..." style="flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px;" />
    <button @click="add()" style="padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">+ Add</button>
  </div>

  <!-- p-for Loop on Array with Index -->
  <ul style="list-style: none; padding: 0; margin: 0 0 1.5rem 0;">
    <template p-for="(item, idx) in filteredList">
      <li style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 0.5rem;">
        <div>
          <span style="color: #94a3b8; font-size: 0.8rem; margin-right: 0.4rem;" p-text="(idx + 1) + '.'"></span>
          <strong p-text="item.name"></strong>
          <span style="font-size: 0.75rem; background: rgba(16, 185, 129, 0.15); color: #059669; padding: 0.15rem 0.45rem; border-radius: 4px; margin-left: 0.5rem;" p-text="item.category"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span style="color: #f59e0b;" p-text="'★'.repeat(item.rating)"></span>
          <button @click="remove(item.id)" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; padding: 0 0.3rem;">✕</button>
        </div>
      </li>
    </template>
  </ul>

  <!-- Range Loop Demo -->
  <div style="background: #f1f5f9; padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.88rem;">
    <strong>Numeric Range Loop (1 to 5):</strong>
    <div style="display: flex; gap: 0.4rem; margin-top: 0.4rem;">
      <template p-for="n in 5">
        <span style="background: white; border: 1px solid #cbd5e1; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 600; color: #0d9488;" p-text="'Step ' + n"></span>
      </template>
    </div>
  </div>
</div>`,

      todo: `<div p-data="{
  todos: [
    { text: 'Try PineJS Signals', done: true },
    { text: 'Build reactive widget', done: false }
  ],
  newTodo: '',
  add() {
    if (this.newTodo.trim()) {
      this.todos.push({ text: this.newTodo, done: false });
      this.newTodo = '';
    }
  },
  remove(index) {
    this.todos.splice(index, 1);
  }
}" style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 450px; margin: 0 auto;">
  <h2 style="color: #10b981; margin-top: 0;">🌲 PineJS Todo List</h2>
  
  <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
    <input p-model="newTodo" @keydown.enter="add" placeholder="What needs doing?" style="flex: 1; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px;" />
    <button @click="add" style="padding: 0.6rem 1.2rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Add</button>
  </div>

  <ul style="list-style: none; padding: 0; margin: 0;">
    <template p-for="(item, idx) in todos">
      <li style="display: flex; align-items: center; justify-content: space-between; padding: 0.6rem; border-bottom: 1px solid #f1f5f9;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" p-model="item.done" />
          <span :style="item.done ? 'text-decoration: line-through; color: #94a3b8;' : 'color: #0f172a;'" p-text="item.text"></span>
        </label>
        <button @click="remove(idx)" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem;">×</button>
      </li>
    </template>
  </ul>
</div>`,

      cart: `<div p-data="{
  items: [
    { id: 1, name: 'Wireless Earbuds', price: 59, qty: 1 },
    { id: 2, name: 'Mechanical Keyboard', price: 129, qty: 1 }
  ],
  coupon: '',
  discountApplied: false,
  get subtotal() {
    return this.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
  },
  get discount() {
    return this.discountApplied ? (this.subtotal * 0.15) : 0;
  },
  get grandTotal() {
    return this.subtotal - this.discount;
  },
  applyCoupon() {
    if (this.coupon.toUpperCase() === 'PINE15') {
      this.discountApplied = true;
    }
  }
}" style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; color: #0f172a;">
  <h2 style="color: #10b981; margin-top: 0;">🛒 Reactive Shopping Cart</h2>
  
  <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; margin-bottom: 1rem;">
    <template p-for="item in items">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <div>
          <strong p-text="item.name"></strong>
          <div style="color: #64748b; font-size: 0.85rem;" p-text="'$' + item.price + ' each'"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <button @click="if (item.qty > 1) item.qty--" style="width: 28px; height: 28px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer;">-</button>
          <span style="font-weight: 700; width: 20px; text-align: center;" p-text="item.qty"></span>
          <button @click="item.qty++" style="width: 28px; height: 28px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer;">+</button>
          <span style="font-weight: 600; min-width: 60px; text-align: right;" p-text="'$' + (item.price * item.qty)"></span>
        </div>
      </div>
    </template>
  </div>

  <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
    <input p-model="coupon" placeholder='Enter coupon (try "PINE15")' style="flex: 1; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px;" />
    <button @click="applyCoupon" style="padding: 0.5rem 1rem; background: #0f172a; color: white; border: none; border-radius: 6px; cursor: pointer;">Apply</button>
  </div>

  <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 0.3rem;">
      <span>Subtotal:</span>
      <strong p-text="'$' + subtotal"></strong>
    </div>
    <div p-show="discountApplied" style="display: flex; justify-content: space-between; margin-bottom: 0.3rem; color: #10b981;">
      <span>Discount (15%):</span>
      <strong p-text="'-$' + discount.toFixed(2)"></strong>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 800; border-top: 1px solid #cbd5e1; padding-top: 0.5rem; margin-top: 0.5rem;">
      <span>Total:</span>
      <span style="color: #10b981;" p-text="'$' + grandTotal.toFixed(2)"></span>
    </div>
  </div>
</div>`,

      tabs: `<div p-data="{ tab: 'home' }" style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 450px; margin: 0 auto;">
  <div style="display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 1.5rem; gap: 1rem;">
    <button @click="tab = 'home'" :style="tab === 'home' ? 'font-weight: 700; border-bottom: 2px solid #10b981; color: #10b981;' : 'color: #64748b;'" style="padding: 0.5rem 0; border: none; background: none; cursor: pointer;">Home</button>
    <button @click="tab = 'profile'" :style="tab === 'profile' ? 'font-weight: 700; border-bottom: 2px solid #10b981; color: #10b981;' : 'color: #64748b;'" style="padding: 0.5rem 0; border: none; background: none; cursor: pointer;">Profile</button>
    <button @click="tab = 'settings'" :style="tab === 'settings' ? 'font-weight: 700; border-bottom: 2px solid #10b981; color: #10b981;' : 'color: #64748b;'" style="padding: 0.5rem 0; border: none; background: none; cursor: pointer;">Settings</button>
  </div>

  <div p-show="tab === 'home'">
    <h3>Dashboard Home</h3>
    <p>Fine-grained reactive tab transitions in pure HTML!</p>
  </div>
  <div p-show="tab === 'profile'">
    <h3>User Profile</h3>
    <p>Name: Alex Dev<br>Framework: PineJS</p>
  </div>
  <div p-show="tab === 'settings'">
    <h3>Application Settings</h3>
    <p>Theme: Light (Default)<br>Reactivity: Signals</p>
  </div>
</div>`,

      persist: `<div p-data="{ user: $persist('John Pine', 'demo_user') }" style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 450px; margin: 0 auto;">
  <h2 style="color: #10b981; margin-top: 0;">💾 $persist LocalStorage</h2>
  <p>Type in the input, refresh the page, and observe persisted state!</p>

  <input p-model="user.value" style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 1rem;" />

  <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 1rem; border-radius: 6px;">
    Persisted Value: <strong style="color: #059669;" p-text="user.value"></strong>
  </div>
</div>`
    };

    const codeInput = document.getElementById('code-input');
    const previewFrame = document.getElementById('preview-frame');
    const presetPicker = document.getElementById('preset-picker');
    const runBtn = document.getElementById('run-btn');
    const refreshBtn = document.getElementById('refresh-btn');

    function updatePreview() {
      const userCode = codeInput.value;
      const cdnUrl = 'https://unpkg.com/pinejs-core@1.3.0/dist/pine.min.js';
      const localUrl = new URL('../dist/pine.min.js', window.location.href).href;
      const htmlDoc = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8" />
          <script src="${cdnUrl}"><\/script>
          <script>window.Pine || document.write('<script src="${localUrl}"><\\/script>')<\/script>
        </head>
        <body style="margin: 0; padding: 1rem; font-family: system-ui, -apple-system, sans-serif;">
          ${userCode}
        </body>
        </html>
      `;
      previewFrame.srcdoc = htmlDoc;
    }

    presetPicker.addEventListener('change', (e) => {
      codeInput.value = presets[e.target.value] || presets.counter;
      updatePreview();
    });

    runBtn.addEventListener('click', updatePreview);
    refreshBtn.addEventListener('click', updatePreview);

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        updatePreview();
      }
    });

    // Auto update with debounce
    let timer;
    codeInput.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(updatePreview, 600);
    });

    // Init with counter preset
    codeInput.value = presets.counter;
    updatePreview();
  </script>
</body>
</html>
