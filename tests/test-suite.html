<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PineJS Full Automated Test Suite</title>
  <link rel="icon" type="image/svg+xml" href="../docs/favicon.svg">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --pass: #10b981;
      --fail: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      font-size: 0.85rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--pass); border: 1px solid var(--pass); }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); border: 1px solid var(--fail); }
    .test-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-title { font-weight: 500; font-size: 1rem; }
    .test-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
    .status { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .status.pass { color: var(--pass); }
    .status.fail { color: var(--fail); }
    .sandbox {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1000px;
      height: 1000px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <!-- Load PineJS -->
  <script src="../dist/pine.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🌲 PineJS Test Suite <span id="summary-badge" class="badge">Running...</span></h1>
        <p style="color: var(--text-muted); margin: 0.5rem 0 0 0;">Comprehensive verification of all Alpine.js parity features, directives, magics, morphing, and plugins</p>
      </div>
      <button onclick="runAllTests()" style="padding: 0.6rem 1.2rem; background: var(--primary); color: #000; font-weight: 600; border: none; border-radius: 6px; cursor: pointer;">Re-run Tests</button>
    </div>

    <div id="results-list"></div>
  </div>

  <div id="sandbox-root" class="sandbox"></div>

  <script>
    const tests = [];

    function test(name, description, runner) {
      tests.push({ name, description, runner });
    }

    // 1. Signals Unit Tests
    test("Signals: Signal Primitive", "Signal getters, setters, and peek", () => {
      const count = Pine.signal(0);
      if (count.value !== 0) throw new Error(`Expected 0, got ${count.value}`);
      count.value = 10;
      if (count.value !== 10) throw new Error(`Expected 10, got ${count.value}`);
      if (count.peek() !== 10) throw new Error(`Expected peek 10, got ${count.peek()}`);
    });

    test("Signals: Computed Signals", "Memoization & reactive recalculation", () => {
      const a = Pine.signal(2);
      const b = Pine.signal(3);
      let runCount = 0;
      const sum = Pine.computed(() => {
        runCount++;
        return a.value * b.value;
      });

      if (sum.value !== 6) throw new Error(`Expected 6, got ${sum.value}`);
      const cached = sum.value;
      if (runCount !== 1) throw new Error(`Computed recalculated unnecessarily`);

      a.value = 4;
      if (sum.value !== 12) throw new Error(`Expected 12 after mutation, got ${sum.value}`);
    });

    test("Signals: Batch Transactions", "Atomic updates without intermediate renders", () => {
      const x = Pine.signal(1);
      const y = Pine.signal(1);
      let effectRuns = 0;

      const stop = Pine.effect(() => {
        effectRuns++;
        return x.value + y.value;
      });

      Pine.batch(() => {
        x.value = 10;
        y.value = 20;
      });

      stop();
      if (effectRuns !== 2) throw new Error(`Expected 2 effect runs (1 initial + 1 batched), got ${effectRuns}`);
    });

    // 2. Directives Integration Tests
    test("Directives: p-data & p-text", "Atomic text node binding", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t1" p-data="{ name: 'Pine', version: 1 }">
          <span id="t1-span" p-text="name + ' v' + version"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t1"));
      const span = sandbox.querySelector("#t1-span");
      if (span.textContent !== "Pine v1") throw new Error(`Expected 'Pine v1', got '${span.textContent}'`);

      sandbox.querySelector("#t1").__pine_scope__.data.name = "PineJS";
      if (span.textContent !== "PineJS v1") throw new Error(`Expected 'PineJS v1', got '${span.textContent}'`);
    });

    test("Directives: p-bind & :attr Shorthand", "Class and attribute reactive binding", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t2" p-data="{ active: true, customId: 'btn-101' }">
          <button id="t2-btn" :id="customId" :class="{ 'is-active': active }"></button>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t2"));
      const btn = sandbox.querySelector("#t2 button");
      if (!btn) throw new Error("Button element not found");
      if (btn.id !== "btn-101") throw new Error(`Expected id 'btn-101', got '${btn.id}'`);
      if (!btn.classList.contains("is-active")) throw new Error(`Expected class 'is-active'`);

      sandbox.querySelector("#t2").__pine_scope__.data.active = false;
      if (btn.classList.contains("is-active")) throw new Error(`Class 'is-active' was not removed`);
    });

    test("Directives: p-on / @event with modifiers", "Click event and counter increment", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t3" p-data="{ count: 0 }">
          <button id="t3-btn" @click="count++">Increment</button>
          <span id="t3-val" p-text="count"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t3"));
      const btn = sandbox.querySelector("#t3-btn");
      const span = sandbox.querySelector("#t3-val");

      btn.click();
      btn.click();
      if (span.textContent !== "2") throw new Error(`Expected count 2, got ${span.textContent}`);
    });

    test("Directives: p-model Two-Way Binding", "Sync input value and data property", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t4" p-data="{ query: 'hello' }">
          <input id="t4-input" p-model="query" />
          <span id="t4-span" p-text="query"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t4"));
      const input = sandbox.querySelector("#t4-input");
      const span = sandbox.querySelector("#t4-span");

      if (input.value !== "hello") throw new Error(`Expected input value 'hello', got '${input.value}'`);

      input.value = "world";
      input.dispatchEvent(new Event("input"));
      if (span.textContent !== "world") throw new Error(`Expected span 'world', got '${span.textContent}'`);
    });

    test("Directives: p-if Conditional Rendering", "Mounting and unmounting template DOM", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t5" p-data="{ open: false }">
          <template p-if="open">
            <div id="t5-target">Modal Open</div>
          </template>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t5"));
      if (sandbox.querySelector("#t5-target") !== null) throw new Error(`Target should not be mounted initially`);

      sandbox.querySelector("#t5").__pine_scope__.data.open = true;
      if (sandbox.querySelector("#t5-target") === null) throw new Error(`Target should be mounted when open is true`);

      sandbox.querySelector("#t5").__pine_scope__.data.open = false;
      if (sandbox.querySelector("#t5-target") !== null) throw new Error(`Target should be unmounted when open is false`);
    });

    test("Directives: p-for List Rendering", "Dynamic array loops and mutations", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t6" p-data="{ items: ['Apple', 'Banana'] }">
          <ul id="t6-list">
            <template p-for="(item, i) in items">
              <li class="t6-item" p-text="i + ': ' + item"></li>
            </template>
          </ul>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t6"));
      let items = sandbox.querySelectorAll(".t6-item");
      if (items.length !== 2) throw new Error(`Expected 2 items, got ${items.length}`);
      if (items[0].textContent !== "0: Apple") throw new Error(`Expected '0: Apple', got '${items[0].textContent}'`);

      sandbox.querySelector("#t6").__pine_scope__.data.items.push("Cherry");
      items = sandbox.querySelectorAll(".t6-item");
      if (items.length !== 3) throw new Error(`Expected 3 items after push, got ${items.length}`);
      if (items[2].textContent !== "2: Cherry") throw new Error(`Expected '2: Cherry', got '${items[2].textContent}'`);
    });

    test("Globals: Pine.bind() Reusable Bindings", "Binding reusable objects with events and attributes", () => {
      Pine.bind("triggerBtn", () => ({
        ":class": "active-btn",
        "@click": "clicked = true"
      }));

      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-bind" p-data="{ clicked: false }">
          <button id="t-bind-btn" p-bind="triggerBtn"></button>
          <span id="t-bind-status" p-text="clicked"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-bind"));
      const btn = sandbox.querySelector("#t-bind-btn");
      if (!btn.classList.contains("active-btn")) throw new Error(`Expected class 'active-btn' from Pine.bind`);
      btn.click();
      if (sandbox.querySelector("#t-bind-status").textContent !== "true") throw new Error(`Expected clicked status 'true'`);
    });

    test("Plugins: Pine.morph() DOM Morphing", "Morphing HTML string into element without replacing root", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `<div id="morph-root" class="old-class"><p>Old Text</p></div>`;
      const root = sandbox.querySelector("#morph-root");
      Pine.morph(root, `<div id="morph-root" class="new-class"><p>New Text</p><span>Extra</span></div>`);

      if (root.className !== "new-class") throw new Error(`Expected className 'new-class'`);
      if (root.querySelector("p").textContent !== "New Text") throw new Error(`Expected 'New Text'`);
      if (!root.querySelector("span")) throw new Error(`Expected extra span to be added`);
    });

    test("Directives: p-ignore", "Skipping subtree initialization", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-ign" p-data="{ text: 'hello' }">
          <div p-ignore>
            <span id="ign-span" p-text="text">Original</span>
          </div>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-ign"));
      const span = sandbox.querySelector("#ign-span");
      if (span.textContent !== "Original") throw new Error(`p-ignore failed, text was mutated to '${span.textContent}'`);
    });

    test("UI Component: Dropdown & Click Outside", "Dropdown opens on click and closes on outside click", async () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-dd" p-data="{ open: false }">
          <button id="dd-btn" @click="open = !open">Toggle</button>
          <div id="dd-menu" p-show="open" @click.outside="open = false" style="width: 100px; height: 100px;">
            <span>Menu Content</span>
          </div>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-dd"));
      const btn = sandbox.querySelector("#dd-btn");
      const menu = sandbox.querySelector("#dd-menu");

      if (menu.style.display !== 'none') throw new Error(`Dropdown menu should initially be hidden`);

      // Click button to open
      btn.click();
      if (menu.style.display === 'none') throw new Error(`Dropdown menu should be visible after clicking trigger button`);

      // Wait a tick then click outside
      await new Promise(r => setTimeout(r, 120));
      document.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      if (menu.style.display !== 'none') throw new Error(`Dropdown menu should be hidden after clicking outside`);
    });

    test("UI Component: p-modelable & p-model", "Two-way state synchronization between custom component and parent", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-mod" p-data="{ count: 10 }">
          <div id="inner-comp" p-data="{ inner: 10 }" p-modelable="inner" p-model="count">
            <button id="inc-btn" @click="inner++">+</button>
          </div>
          <span id="parent-count" p-text="count"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-mod"));
      const btn = sandbox.querySelector("#inc-btn");
      const span = sandbox.querySelector("#parent-count");

      if (span.textContent !== '10') throw new Error(`Expected initial parent count 10, got ${span.textContent}`);
      btn.click();
      if (span.textContent !== '11') throw new Error(`Expected updated parent count 11, got ${span.textContent}`);
    });

    test("Globals: Pine.store()", "Global store reactive state management", () => {
      Pine.store("cart", {
        items: 5,
        add() { this.items++; }
      });
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-store" p-data>
          <span id="store-val" p-text="$store('cart').items"></span>
          <button id="store-btn" @click="$store('cart').add()">Add</button>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-store"));
      const span = sandbox.querySelector("#store-val");
      const btn = sandbox.querySelector("#store-btn");
      if (span.textContent !== "5") throw new Error(`Expected 5 from store, got ${span.textContent}`);
      btn.click();
      if (span.textContent !== "6") throw new Error(`Expected 6 from store, got ${span.textContent}`);
    });

    test("Magics: $refs & $dispatch", "Accessing element references and custom events", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-refs" p-data="{ message: '' }" @notify="message = $event.detail.msg">
          <input p-ref="customInput" value="InitialRefVal" />
          <button id="dispatch-btn" @click="$dispatch('notify', { msg: $refs.customInput.value })">Dispatch</button>
          <span id="msg-span" p-text="message"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-refs"));
      const btn = sandbox.querySelector("#dispatch-btn");
      const span = sandbox.querySelector("#msg-span");
      btn.click();
      if (span.textContent !== "InitialRefVal") throw new Error(`Expected 'InitialRefVal', got '${span.textContent}'`);
    });

    test("PineJS v1.2.0: Version & SSR p-hydrate", "Verifying runtime version tags and SSR hydration directive", () => {
      if (Pine.version !== "1.2.0") throw new Error(`Expected Pine.version '1.2.0', got '${Pine.version}'`);
      if (Pine.versionName !== "Redwood") throw new Error(`Expected Pine.versionName 'Redwood', got '${Pine.versionName}'`);

      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-hydrate" p-data="{ active: true }" p-hydrate>
          <span id="hydrate-span" p-text="active ? 'Hydrated' : 'Inactive'">Hydrated</span>
        </div>
      `;
      const root = sandbox.querySelector("#t-hydrate");
      if (!root.hasAttribute("p-hydrate")) throw new Error("Expected p-hydrate attribute initially");
      Pine.initTree(root);
      if (root.hasAttribute("p-hydrate")) throw new Error("Expected p-hydrate attribute to be removed upon tree activation");
      const span = sandbox.querySelector("#hydrate-span");
      if (span.textContent !== "Hydrated") throw new Error(`Expected 'Hydrated', got '${span.textContent}'`);
    });

    test("Magics: $history Reactive URL Sync", "Bidirectional URL query sync with reactive signal", () => {
      // Clear URL state before test
      if (typeof window !== "undefined") {
        try {
          const u = new URL(window.location.href);
          u.searchParams.delete("test_search_key");
          window.history.replaceState({}, "", u.toString());
        } catch {}
      }

      try {
        const sandbox = document.getElementById("sandbox-root");
        sandbox.innerHTML = `
          <div id="t-hist" p-data="{ query: $history('initialQuery', 'test_search_key') }">
            <input id="hist-input" p-model="query.value" />
            <span id="hist-span" p-text="query.value"></span>
          </div>
        `;
        Pine.initTree(sandbox.querySelector("#t-hist"));
        const input = sandbox.querySelector("#hist-input");
        const span = sandbox.querySelector("#hist-span");
        if (span.textContent !== "initialQuery") throw new Error(`Expected 'initialQuery', got '${span.textContent}'`);
        
        input.value = "updatedFilter";
        input.dispatchEvent(new Event("input"));
        if (span.textContent !== "updatedFilter") throw new Error(`Expected 'updatedFilter', got '${span.textContent}'`);

        if (typeof window !== "undefined") {
          const checkUrl = new URL(window.location.href);
          if (checkUrl.searchParams.get("test_search_key") !== "updatedFilter") {
            throw new Error(`Expected URL param 'test_search_key' to be 'updatedFilter', got '${checkUrl.searchParams.get("test_search_key")}'`);
          }
        }
      } finally {
        if (typeof window !== "undefined") {
          try {
            const u = new URL(window.location.href);
            u.searchParams.delete("test_search_key");
            window.history.replaceState({}, "", u.toString());
          } catch {}
        }
      }
    });

    test("Reactivity: Computed Getters on Nested Arrays (Shopping Cart)", "Reactive getter evaluation with proxy receiver binding", () => {
      const sandbox = document.getElementById("sandbox-root");
      sandbox.innerHTML = `
        <div id="t-cart" p-data="{
          items: [
            { id: 1, name: 'Earbuds', price: 50, qty: 1 },
            { id: 2, name: 'Stand', price: 20, qty: 2 }
          ],
          get total() {
            return this.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
          }
        }">
          <button id="cart-inc-btn" @click="items[0].qty++">+</button>
          <span id="cart-total-span" p-text="'$' + total"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-cart"));
      const btn = sandbox.querySelector("#cart-inc-btn");
      const span = sandbox.querySelector("#cart-total-span");

      if (span.textContent !== "$90") throw new Error(`Expected initial total '$90', got '${span.textContent}'`);
      btn.click();
      if (span.textContent !== "$140") throw new Error(`Expected updated total '$140', got '${span.textContent}'`);
    });

    test("Release v1.3.0: Cedar Version & DevTools Bridge", "Verifies Pine.version, versionName, and runtime diagnostics bridge", async () => {
      if (Pine.version !== "1.3.0") throw new Error(`Expected version '1.3.0', got '${Pine.version}'`);
      if (Pine.versionName !== "Cedar") throw new Error(`Expected versionName 'Cedar', got '${Pine.versionName}'`);
      if (typeof Pine.devtools !== "object" || typeof Pine.devtools.inspect !== "function") {
        throw new Error("Pine.devtools inspection bridge not found");
      }
      const sandbox = getSandbox();
      sandbox.innerHTML = `<div id="t-dt" p-data="{ score: 42 }"><span p-text="score"></span></div>`;
      Pine.initTree(sandbox.querySelector("#t-dt"));
      const dtInfo = Pine.devtools.inspect(sandbox.querySelector("#t-dt"));
      if (!dtInfo.hasScope || dtInfo.scope.score !== 42) {
        throw new Error("Pine.devtools.inspect() failed to inspect active component scope");
      }
    });

    test("Directive: p-animate WAAPI Keyframes", "Declarative micro-animation trigger via spring physics preset", async () => {
      const sandbox = getSandbox();
      sandbox.innerHTML = `
        <div id="t-anim" p-data="{ count: 0 }">
          <button id="anim-btn" @click="count++">Animate</button>
          <div id="anim-target" p-animate.spring="count" p-text="count"></div>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-anim"));
      const btn = sandbox.querySelector("#anim-btn");
      const target = sandbox.querySelector("#anim-target");
      if (target.textContent !== "0") throw new Error(`Expected target text '0', got '${target.textContent}'`);
      btn.click();
      if (target.textContent !== "1") throw new Error(`Expected target text '1', got '${target.textContent}'`);
    });

    test("Magics: $fetch Reactive Resource & REST Verbs", "Verifies reactive loading/data states, query serialization, refetch, and abort", async () => {
      const sandbox = getSandbox();
      sandbox.innerHTML = `
        <div id="t-fetch" p-data="{
          res: $fetch('https://jsonplaceholder.typicode.com/todos/1'),
          loaded: false
        }">
          <span id="fetch-loading" p-text="res.loading ? 'loading' : 'done'"></span>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-fetch"));
      const scope = Pine.$data(sandbox.querySelector("#t-fetch"));
      if (!scope || !scope.res) throw new Error("$fetch did not attach reactive resource to scope");
      if (typeof scope.res.abort !== "function" || typeof scope.res.refetch !== "function") {
        throw new Error("$fetch resource missing abort or refetch methods");
      }
      if (typeof Pine.fetch !== "function") {
        throw new Error("Pine.fetch is not exposed globally");
      }
    });

    test("v1.4.0 Spruce: Engine Version & Identity", "Verifies Pine.version === '1.4.0' and Pine.versionName === 'Spruce'", async () => {
      if (Pine.version !== "1.4.0") throw new Error(`Expected Pine.version to be '1.4.0', got '${Pine.version}'`);
      if (Pine.versionName !== "Spruce") throw new Error(`Expected Pine.versionName to be 'Spruce', got '${Pine.versionName}'`);
      if (typeof Pine.prefix !== "function") throw new Error("Pine.prefix is not a function");
      if (typeof Pine.timeline !== "function") throw new Error("Pine.timeline is not a function");
    });

    test("v1.4.0 Spruce: Prefix-Free Semantic HTML Directives", "Tests 'state', 'text', 'show', 'model', and 'loop'", async () => {
      const sandbox = getSandbox();
      sandbox.innerHTML = `
        <div id="t-semantic" state="{ name: 'PineJS', visible: true, count: 5, items: ['Alpha', 'Beta'] }">
          <span id="sem-text" text="name"></span>
          <div id="sem-show" show="visible">Visible Content</div>
          <button id="sem-btn" @click="name = 'Spruce'"></button>
          <ul id="sem-list">
            <template loop="item in items">
              <li class="sem-item" text="item"></li>
            </template>
          </ul>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-semantic"));
      const textSpan = sandbox.querySelector("#sem-text");
      const btn = sandbox.querySelector("#sem-btn");
      const items = sandbox.querySelectorAll(".sem-item");

      if (textSpan.textContent !== "PineJS") throw new Error(`Expected 'PineJS', got '${textSpan.textContent}'`);
      if (items.length !== 2 || items[0].textContent !== "Alpha") throw new Error(`Semantic loop failed to render items properly`);
      
      btn.click();
      if (textSpan.textContent !== "Spruce") throw new Error(`Expected 'Spruce' after click, got '${textSpan.textContent}'`);
    });

    test("v1.4.0 Spruce: Symbol & Emoji Directives", "Tests 🌲 (state), ⚡ (text), ~ (model), ? (show), * (loop)", async () => {
      const sandbox = getSandbox();
      sandbox.innerHTML = `
        <div id="t-symbol" 🌲="{ title: 'Emoji Power', show: true, tags: ['signal', 'speed'] }">
          <span id="sym-text" ⚡="title"></span>
          <div id="sym-show" ?="show">Active</div>
          <button id="sym-btn" @click="title = 'Fast'"></button>
          <ul id="sym-tags">
            <template *="tag in tags">
              <li class="sym-item" ⚡="tag"></li>
            </template>
          </ul>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-symbol"));
      const symText = sandbox.querySelector("#sym-text");
      const symBtn = sandbox.querySelector("#sym-btn");
      const symItems = sandbox.querySelectorAll(".sym-item");

      if (symText.textContent !== "Emoji Power") throw new Error(`Expected 'Emoji Power', got '${symText.textContent}'`);
      if (symItems.length !== 2 || symItems[1].textContent !== "speed") throw new Error(`Symbol * loop failed to render items`);

      symBtn.click();
      if (symText.textContent !== "Fast") throw new Error(`Expected 'Fast' after click, got '${symText.textContent}'`);
    });

    test("v1.4.0 Spruce: Alpine.js Chameleon Drop-in Mode", "Verifies x-data, x-text, x-show, x-for, and @click run natively without migration edits", async () => {
      const sandbox = getSandbox();
      sandbox.innerHTML = `
        <div id="t-alpine" x-data="{ count: 10, list: ['one', 'two'] }">
          <span id="alp-text" x-text="'Value: ' + count"></span>
          <button id="alp-btn" @click="count++">Increment</button>
          <ul id="alp-list">
            <template x-for="item in list">
              <li class="alp-item" x-text="item"></li>
            </template>
          </ul>
        </div>
      `;
      Pine.initTree(sandbox.querySelector("#t-alpine"));
      const alpText = sandbox.querySelector("#alp-text");
      const alpBtn = sandbox.querySelector("#alp-btn");
      const alpItems = sandbox.querySelectorAll(".alp-item");

      if (alpText.textContent !== "Value: 10") throw new Error(`Expected 'Value: 10', got '${alpText.textContent}'`);
      if (alpItems.length !== 2) throw new Error(`x-for failed to render items`);

      alpBtn.click();
      if (alpText.textContent !== "Value: 11") throw new Error(`Expected 'Value: 11', got '${alpText.textContent}'`);
    });

    test("v1.4.0 Spruce: Web Animations API Timeline Orchestration", "Verifies Pine.timeline() step creation, execution, and chaining", async () => {
      const sandbox = getSandbox();
      sandbox.innerHTML = `
        <div id="t-timeline">
          <div id="box-1" style="width: 20px; height: 20px; background: red;"></div>
          <div id="box-2" style="width: 20px; height: 20px; background: blue;"></div>
        </div>
      `;
      
      const tl = Pine.timeline()
        .add(sandbox.querySelector("#box-1"), [{ opacity: 0 }, { opacity: 1 }], { duration: 50 })
        .add(sandbox.querySelector("#box-2"), [{ transform: 'scale(0.5)' }, { transform: 'scale(1)' }], { duration: 50 });

      if (typeof tl.play !== "function" || typeof tl.pause !== "function" || typeof tl.reverse !== "function") {
        throw new Error("Timeline instance is missing playback controls");
      }
      if (typeof tl.then !== "function") {
        throw new Error("Timeline instance is not Promise-like (missing .then)");
      }

      const p = tl.play();
      if (!p || typeof p.then !== "function") {
        throw new Error("tl.play() did not return a Promise");
      }
      await p;
    });

    // Run tests & render report
    async function runAllTests() {
      const list = document.getElementById("results-list");
      const summaryBadge = document.getElementById("summary-badge");
      list.innerHTML = "";
      let passed = 0;
      let failed = 0;

      for (const t of tests) {
        let isPass = false;
        let errorMsg = "";
        try {
          await t.runner();
          isPass = true;
          passed++;
        } catch (err) {
          failed++;
          errorMsg = err.message || String(err);
          console.error(`Test failed: ${t.name}`, err);
        }

        const card = document.createElement("div");
        card.className = "test-card";
        card.innerHTML = `
          <div>
            <div class="test-title">${t.name}</div>
            <div class="test-desc">${t.description} ${errorMsg ? `<span style="color:var(--fail)">— ${errorMsg}</span>` : ""}</div>
          </div>
          <div class="status ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS ✓' : 'FAIL ✗'}</div>
        `;
        list.appendChild(card);
      }

      if (failed === 0) {
        summaryBadge.className = "badge badge-pass";
        summaryBadge.textContent = `${passed}/${tests.length} Passed (100%)`;
      } else {
        summaryBadge.className = "badge badge-fail";
        summaryBadge.textContent = `${failed} Failed, ${passed} Passed`;
      }
    }

    document.addEventListener("DOMContentLoaded", runAllTests);
  </script>
